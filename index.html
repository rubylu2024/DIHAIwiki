<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>灵天高中官网</title>
    <style type="text/css">
        :root {
            --page-width: 980px;
            --accent: #d35b3c;
            --menu: #505050;
            --footer: #0c0c0c;
            --muted: #7a7a7a;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #ffffff;
            color: #1c1c1c;
        }

        img {
            display: block;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .topbar {
            background: #ffffff;
        }

        .topbar__inner {
            width: var(--page-width);
            margin: 0 auto;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 16px 0 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 58px;
        }

        .brand__logo {
            height: 58px;
            width: auto;
        }

        .contact {
            text-align: right;
            padding-top: 6px;
        }

        .contact__label {
            height: 26px;
            width: auto;
        }

        .contact__phone {
            margin-top: 6px;
            font-size: 13px;
            color: #4a4a4a;
        }

        .accent-bar {
            height: 34px;
            background: var(--accent);
        }

        .hero {
            background: #ffffff;
        }

        .hero__inner {
            width: var(--page-width);
            margin: 0 auto;
            padding: 0 16px;
        }

        .hero img {
            width: 100%;
            height: auto;
        }

        .menu {
            background: var(--menu);
        }

        .menu__inner {
            width: var(--page-width);
            margin: 0 auto;
            height: 92px;
            display: flex;
            align-items: center;
        }

        .menu__item {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .menu__item img {
            height: 58px;
            width: auto;
        }

        .feature {
            background: #ffffff;
            padding: 56px 0 60px;
        }

        .feature__inner {
            width: var(--page-width);
            margin: 0 auto;
            position: relative;
            min-height: 380px;
        }

        .feature__stage {
            position: relative;
            width: 740px;
            margin-left: auto;
            height: 360px;
        }

        .feature__backdrop {
            position: absolute;
            top: -34px;
            left: -120px;
            width: 520px;
            height: 250px;
            background: var(--accent);
        }

        .feature__photo {
            position: absolute;
            top: 0;
            right: 0;
            width: 640px;
            height: 360px;
            object-fit: cover;
        }

        .feature__card {
            position: absolute;
            left: -40px;
            top: 92px;
            width: 310px;
            padding: 18px 18px 16px;
            background: rgba(255, 255, 255, 0.9);
        }

        .feature__title {
            font-size: 13px;
            font-weight: 700;
            color: #2b2b2b;
            margin: 0;
            line-height: 1.4;
        }

        .feature__desc {
            margin: 8px 0 12px;
            font-size: 11px;
            color: #6a6a6a;
            line-height: 1.65;
        }

        .feature__btn {
            display: inline-block;
            padding: 7px 16px;
            font-size: 12px;
            color: #ffffff;
            background: var(--accent);
        }

        .feature__decor {
            position: absolute;
            left: 120px;
            top: 190px;
            width: 70px;
            height: 70px;
        }

        .feature__decor::before,
        .feature__decor::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--accent);
        }

        .feature__decor::before {
            left: 18px;
            top: 18px;
        }

        .feature__decor::after {
            left: 36px;
            top: 36px;
            background: #1c1c1c;
        }

        .feature__decor2 {
            position: absolute;
            left: 118px;
            top: 258px;
            width: 10px;
            height: 10px;
            background: #1c1c1c;
        }

        .placeholder {
            height: 370px;
            background: #cfcfcf;
        }

        .footer {
            background: var(--footer);
            color: #ededed;
        }

        .footer__top {
            width: var(--page-width);
            margin: 0 auto;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }

        .footer__top a {
            color: #dedede;
        }

        .footer__bottom {
            background: var(--accent);
            height: 46px;
            display: flex;
            align-items: center;
        }

        .footer__bottom-inner {
            width: var(--page-width);
            margin: 0 auto;
            font-size: 11px;
            color: #f6f1ee;
        }

        @media (max-width: 1020px) {
            :root {
                --page-width: 92vw;
            }

            .feature__stage {
                width: 100%;
                margin-left: 0;
            }

            .feature__card {
                left: 14px;
            }

            .feature__backdrop {
                left: 0;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar__inner">
            <div class="brand">
                <img class="brand__logo" src="image/lingtian_education_rra_st_2.png" alt="灵天高中官网">
            </div>
            <div class="contact" id="contact">
                <img class="contact__label" src="image/era_ba_a0n0_810_1.png" alt="联系我们">
                <div class="contact__phone">400-810-3859</div>
            </div>
        </div>
    </header>

    <div class="accent-bar"></div>

    <section class="hero">
        <div class="hero__inner">
            <img src="image/image_9.png" alt="欢迎来到灵天高中">
        </div>
    </section>

    <nav class="menu">
        <div class="menu__inner">
            <a class="menu__item" href="#test" aria-label="陨力测试">
                <img src="image/image_5.png" alt="陨力测试">
            </a>
            <a class="menu__item" href="#brain" aria-label="短期换脑">
                <img src="image/image_6.png" alt="短期换脑">
            </a>
            <a class="menu__item" href="#products" aria-label="更多产品">
                <img src="image/image_7.png" alt="更多产品">
            </a>
            <a class="menu__item" href="#about" aria-label="关于我们">
                <img src="image/image_3.png" alt="关于我们">
            </a>
        </div>
    </nav>

    <main>
        <section class="feature" id="about">
            <div class="feature__inner">
                <div class="feature__decor"></div>
                <div class="feature__decor2"></div>
                <div class="feature__stage">
                    <div class="feature__backdrop"></div>
                    <img class="feature__photo" src="image/教室.png" alt="教学环境">
                    <div class="feature__card">
                        <p class="feature__title">专业以及导师授课，极致般的神奇体验</p>
                        <p class="feature__desc">
                            欢迎来到灵天高中官方网站。这里提供课程介绍、教学环境展示与校务资讯。
                            我们坚持以学生成长为中心，提供更高质量的学习体验。
                        </p>
                        <a class="feature__btn" href="#products">了解详情</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="placeholder" id="products">
            <div id="test"></div>
            <div id="brain"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__top">
            <a href="#about">关于我们</a>
            <a href="#brain">换脑课程</a>
            <a href="#products">相关产品</a>
            <a href="#test">客户反馈</a>
            <a href="#contact">联系我们</a>
        </div>
        <div class="footer__bottom">
            <div class="footer__bottom-inner">版权所有 © 灵天高中官网</div>
        </div>
    </footer>
</body>
</html>
