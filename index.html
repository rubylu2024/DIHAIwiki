<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>DIHAI - 地海搜索</title>
    <style type="text/css">
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }
        
        #header {
            text-align: right;
            padding: 10px 20px;
            font-size: 13px;
        }
        
        #header a {
            color: #333333;
            text-decoration: none;
            margin-left: 20px;
        }
        
        #header a:hover {
            text-decoration: underline;
        }
        
        #main {
            text-align: center;
            padding-top: 100px;
        }
        
        #logo {
            margin-bottom: 30px;
        }
        
        #logo h1 {
            font-size: 72px;
            font-weight: normal;
            margin: 0;
            letter-spacing: -2px;
        }
        
        #logo .blue { color: #0066ff; }
        #logo .red { color: #ff0000; }
        #logo .yellow { color: #ffcc00; }
        #logo .green { color: #00cc00; }
        
        #searchbox {
            width: 450px;
            height: 28px;
            font-size: 16px;
            padding: 5px 10px;
            border: 1px solid #d0d0d0;
            margin-bottom: 20px;
        }
        
        #searchbox:hover {
            border-color: #999999;
        }
        
        #searchbox:focus {
            outline: none;
            border-color: #0066ff;
        }
        
        #searchbox::placeholder {
            color: #999999;
        }
        
        #buttons {
            margin-top: 10px;
        }
        
        .btn {
            background-color: #f5f5f5;
            border: 1px solid #d0d0d0;
            color: #333333;
            font-size: 11px;
            font-weight: bold;
            padding: 8px 16px;
            margin: 0 5px;
            cursor: pointer;
        }
        
        .btn:hover {
            border-color: #999999;
            background-color: #f8f8f8;
        }
        
        #footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: #f2f2f2;
            border-top: 1px solid #e4e4e4;
            padding: 10px 20px;
            font-size: 13px;
        }
        
        #footer a {
            color: #666666;
            text-decoration: none;
            margin-right: 20px;
        }
        
        #footer a:hover {
            text-decoration: underline;
        }
        
        #footer-left {
            float: left;
        }
        
        #footer-right {
            float: right;
        }
        
        .clear {
            clear: both;
        }
    </style>
</head>
<body>
    <div id="header">
        <a href="#">邮件</a>
        <a href="#">图片</a>
        <a href="#" style="font-weight: bold;">登录</a>
    </div>
    
    <div id="main">
        <div id="logo">
            <h1>
                <span class="blue">D</span>
                <span class="red">I</span>
                <span class="yellow">H</span>
                <span class="blue">A</span>
                <span class="green">I</span>
            </h1>
        </div>
        
        <form action="#" method="get">
            <input type="text" id="searchbox" name="q" placeholder="地海搜索，想你所猜" autocomplete="off">
            <br>
            <div id="buttons">
                <input type="submit" class="btn" value="搜索">
                <input type="button" class="btn" value="手气不错">
            </div>
        </form>
        
        <p style="font-size: 11px; color: #666666; margin-top: 30px;">
            地海搜索，想你所猜
        </p>
    </div>
    
    <div id="footer">
        <div id="footer-left">
            <a href="#">关于我们</a>
            <a href="#">广告服务</a>
            <a href="#">企业解决方案</a>
        </div>
        <div id="footer-right">
            <a href="#">隐私政策</a>
            <a href="#">使用条款</a>
            <a href="#">设置</a>
        </div>
        <div class="clear"></div>
    </div>
</body>
</html>
