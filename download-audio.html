<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>视频下载</title>
    <style>
        :root { --bg: #0b0b0b; --panel: #141414; --border: #2a2a2a; --text: #ededed; --muted: rgba(255,255,255,.65); --accent: #e4553b; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft YaHei", Arial, sans-serif; background: radial-gradient(800px 460px at 50% 10%, rgba(228, 85, 59, 0.16), transparent 62%), var(--bg); color: var(--text); }
        .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { width: 720px; max-width: 96vw; background: linear-gradient(#171717, var(--panel)); border: 1px solid var(--border); padding: 18px 18px 16px; }
        h1 { margin: 0; font-size: 16px; letter-spacing: 1px; }
        p { margin: 10px 0 0; font-size: 12px; color: var(--muted); line-height: 1.7; }
        .actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 14px; font-size: 12px; letter-spacing: 1px; border: 1px solid #343434; background: #1c1c1c; color: var(--text); text-decoration: none; cursor: pointer; }
        .btn--primary { background: var(--accent); border-color: #7d2f22; color: #fff; }
        .btn:active { transform: translateY(1px); }
        video { width: 100%; margin-top: 14px; background: #000; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <h1>视频下载</h1>
            <div class="actions">
                <a class="btn btn--primary" href="audio/music.mp4" download>下载视频</a>
            </div>
            <video controls preload="metadata">
                <source src="audio/music.mp4" type="video/mp4">
            </video>
        </div>
    </div>
</body>
</html>
