<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>密码验证页</title>
    <style type="text/css">
        :root {
            --accent: #e4553b;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #000000;
            color: #f2f2f2;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .wrap {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 18px;
        }

        .gate {
            width: 720px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .art {
            width: 320px;
            max-width: 78vw;
            height: auto;
            filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.65));
        }

        .hint {
            margin-top: 18px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
        }

        .input-shell {
            margin-top: 14px;
            width: 520px;
            max-width: 92vw;
            height: 78px;
            background-image: url("image/密码页输入框.png");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            filter: drop-shadow(0 6px 18px rgba(228, 85, 59, 0.14));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 26px;
        }

        .pwd {
            width: 100%;
            height: 44px;
            border: 0;
            outline: none;
            background: transparent;
            font-size: 22px;
            letter-spacing: 2px;
            color: rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .pwd::placeholder {
            color: rgba(0, 0, 0, 0.28);
            letter-spacing: 1px;
        }

        .msg {
            margin-top: 0;
            height: 0;
            overflow: hidden;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.65);
        }

        .msg.is-error {
            color: rgba(228, 85, 59, 0.95);
            height: auto;
            margin-top: 10px;
        }

        .nav {
            position: fixed;
            left: 16px;
            top: 14px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .nav a:hover {
            color: rgba(255, 255, 255, 0.88);
            text-decoration: underline;
        }

        .scan-view {
            display: none;
            width: 980px;
            max-width: 100%;
        }

        .scan-view.is-open {
            display: block;
        }

        .scan-top {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 10px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
        }

        .scan-title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 1px;
        }

        .scan-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .scan-btn {
            border: 0;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.9);
            height: 34px;
            padding: 0 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .scan-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .scan-body {
            padding: 18px 10px 46px;
            display: grid;
            gap: 26px;
            justify-content: center;
        }

        .scan-page {
            width: 820px;
            max-width: calc(100vw - 36px);
            background: #f7f1de;
            border-radius: 4px;
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.55);
            position: relative;
            overflow: hidden;
        }

        .scan-page::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 0, 0, 0.05), transparent 42%),
                radial-gradient(circle at 80% 70%, rgba(0, 0, 0, 0.05), transparent 45%),
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.018), rgba(0, 0, 0, 0.018) 1px, transparent 1px, transparent 3px);
            opacity: 0.85;
            pointer-events: none;
            mix-blend-mode: multiply;
        }

        .scan-page::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.18), transparent 50%, rgba(0, 0, 0, 0.06));
            opacity: 0.7;
            pointer-events: none;
        }

        .scan-inner {
            position: relative;
            padding: 30px 34px 22px;
            color: rgba(0, 0, 0, 0.86);
            font-family: "Songti SC", "SimSun", serif;
        }

        .scan-h1 {
            text-align: center;
            font-size: 20px;
            letter-spacing: 3px;
            margin: 0;
            font-weight: 700;
        }

        .scan-meta {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.6);
        }

        .scan-table {
            margin-top: 16px;
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .scan-table th,
        .scan-table td {
            border: 1px solid rgba(0, 0, 0, 0.22);
            padding: 6px 6px;
            vertical-align: middle;
        }

        .scan-table th {
            background: rgba(0, 0, 0, 0.04);
            font-weight: 700;
        }

        .scan-foot {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.58);
        }

        .scan-stamp {
            position: absolute;
            right: 38px;
            bottom: 34px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid rgba(228, 85, 59, 0.55);
            transform: rotate(-14deg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(228, 85, 59, 0.6);
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            padding: 18px;
            font-size: 13px;
        }

        .scan-stamp span {
            display: block;
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="gate" id="gate">
            <img class="art" src="image/密码页图.png" alt="">
            <div class="hint">输入密码</div>
            <div class="input-shell">
                <input class="pwd" id="pwd" type="text" placeholder="" autocomplete="off" inputmode="numeric">
            </div>
            <div class="msg" id="msg"></div>
        </div>

        <div class="nav"><a href="index.html">返回首页</a></div>

        <div class="scan-view" id="scanView">
            <div class="scan-top">
                <div class="scan-title">注册名单扫描件（共 32 页，每页 20 人）</div>
                <div class="scan-actions">
                    <button class="scan-btn" type="button" id="scanBack">返回</button>
                </div>
            </div>
            <div class="scan-body" id="scanBody"></div>
        </div>
    </div>

    <script>
        (function () {
            var PASSWORDS = ["123456"];
            var pwd = document.getElementById("pwd");
            var msg = document.getElementById("msg");
            var gate = document.getElementById("gate");
            var scanView = document.getElementById("scanView");
            var scanBody = document.getElementById("scanBody");
            var scanBack = document.getElementById("scanBack");

            if (!pwd || !msg || !gate || !scanView || !scanBody || !scanBack) return;

            function rng(seed) {
                var x = seed >>> 0;
                return function () {
                    x ^= x << 13;
                    x ^= x >>> 17;
                    x ^= x << 5;
                    return (x >>> 0) / 4294967296;
                };
            }

            function hash(str) {
                var h = 2166136261;
                for (var i = 0; i < str.length; i++) {
                    h ^= str.charCodeAt(i);
                    h = Math.imul(h, 16777619);
                }
                return h >>> 0;
            }

            function pick(r, arr) {
                return arr[Math.floor(r() * arr.length)];
            }

            function pad2(n) {
                return (n < 10 ? "0" : "") + n;
            }

            function genPhone(r) {
                var prefixes = ["130", "131", "132", "133", "135", "136", "137", "138", "139", "150", "151", "152", "155", "156", "157", "158", "159", "170", "171", "172", "173", "175", "176", "177", "178", "180", "181", "182", "183", "185", "186", "187", "188", "189"];
                var p = pick(r, prefixes);
                var s = "";
                for (var i = 0; i < 8; i++) s += Math.floor(r() * 10);
                var full = p + s;
                return full.slice(0, 3) + "■■■■" + full.slice(7);
            }

            function genName(r) {
                var surnames = ["赵", "钱", "孙", "李", "周", "吴", "郑", "王", "冯", "陈", "褚", "卫", "蒋", "沈", "韩", "杨", "朱", "秦", "尤", "许", "何", "吕", "施", "张", "孔", "曹", "严", "华", "金", "魏", "陶", "姜", "戚", "谢", "邹", "喻", "柏", "水", "窦", "章", "云", "苏", "潘", "葛", "奚", "范", "彭", "郎", "鲁", "韦", "昌", "马", "苗", "凤", "花", "方", "俞", "任", "袁", "柳", "酆", "鲍", "史", "唐", "费", "廉", "岑", "薛", "雷", "贺", "倪", "汤", "滕", "殷", "罗", "毕", "郝", "邬", "安", "常", "乐", "于", "时", "傅", "皮", "卞", "齐", "康", "伍", "余", "元", "卜", "顾", "孟", "平", "黄", "和", "穆", "萧", "尹"];
                var given = ["子", "若", "安", "宁", "辰", "熙", "然", "涵", "沐", "宸", "昕", "言", "清", "宥", "予", "亦", "文", "雨", "诗", "书", "思", "梓", "嘉", "悦", "可", "心", "一", "然", "泽", "航", "轩", "珂", "琳", "雅", "菲", "妍", "彤", "璇", "珊", "岚", "昊", "宇", "晨", "峰", "睿", "博", "凯", "洋", "杰", "鑫", "铭", "浩", "磊", "婷", "瑶", "珺", "琪", "卓", "逸"];
                var surname = pick(r, surnames);
                var n = r() < 0.55 ? 2 : 1;
                var g = pick(r, given) + (n === 2 ? pick(r, given) : "");
                return surname + g;
            }

            function genTime(r) {
                var useEarly = r() < 0.5;
                var year, month, day;
                if (useEarly) {
                    year = 2006 + Math.floor(r() * 4);
                    month = 1 + Math.floor(r() * 12);
                    day = 1 + Math.floor(r() * 28);
                } else {
                    year = 2013 + Math.floor(r() * 3);
                    var maxMonth = year === 2015 ? 4 : 12;
                    month = 1 + Math.floor(r() * maxMonth);
                    day = 1 + Math.floor(r() * 28);
                }
                var hour = 9 + Math.floor(r() * 10);
                var min = Math.floor(r() * 60);
                return {
                    ts: +new Date(year, month - 1, day, hour, min, 0, 0),
                    display: year + "-" + pad2(month) + "-" + pad2(day) + " " + pad2(hour) + ":" + pad2(min)
                };
            }

            function renderScan(seedStr) {
                var r = rng(hash(seedStr));
                var totalPages = 32;
                var perPage = 20;
                var total = totalPages * perPage;

                var rows = new Array(total);
                for (var i = 0; i < total; i++) {
                    var t = genTime(r);
                    rows[i] = {
                        idx: i + 1,
                        name: genName(r),
                        sex: r() < 0.52 ? "男" : "女",
                        phone: genPhone(r),
                        time: t.display,
                        ts: t.ts
                    };
                }

                rows.sort(function (a, b) {
                    return a.ts - b.ts;
                });
                for (var k = 0; k < rows.length; k++) {
                    rows[k].idx = k + 1;
                }

                scanBody.innerHTML = "";

                for (var p = 1; p <= totalPages; p++) {
                    var page = document.createElement("div");
                    page.className = "scan-page";
                    var rot = (r() * 2 - 1) * 0.55;
                    page.style.transform = "rotate(" + rot.toFixed(2) + "deg)";

                    var inner = document.createElement("div");
                    inner.className = "scan-inner";

                    var h1 = document.createElement("div");
                    h1.className = "scan-h1";
                    h1.textContent = "灵天教育报名登记表";
                    inner.appendChild(h1);

                    var meta = document.createElement("div");
                    meta.className = "scan-meta";
                    meta.innerHTML = "<span>编号：LT-" + (1000 + p) + "</span><span>页码：" + p + " / " + totalPages + "</span>";
                    inner.appendChild(meta);

                    var table = document.createElement("table");
                    table.className = "scan-table";
                    table.innerHTML = "<thead><tr><th style=\"width:56px;\">序号</th><th style=\"width:120px;\">姓名</th><th style=\"width:64px;\">性别</th><th>手机号</th><th style=\"width:170px;\">登记时间</th></tr></thead>";
                    var tbody = document.createElement("tbody");

                    var start = (p - 1) * perPage;
                    for (var j = 0; j < perPage; j++) {
                        var row = rows[start + j];
                        var tr = document.createElement("tr");
                        tr.innerHTML = "<td>" + row.idx + "</td><td>" + row.name + "</td><td>" + row.sex + "</td><td>" + row.phone + "</td><td>" + row.time + "</td>";
                        tbody.appendChild(tr);
                    }
                    table.appendChild(tbody);
                    inner.appendChild(table);

                    var foot = document.createElement("div");
                    foot.className = "scan-foot";
                    foot.innerHTML = "<span>存档：内部资料</span><span>复核：已归档</span>";
                    inner.appendChild(foot);

                    var stamp = document.createElement("div");
                    stamp.className = "scan-stamp";
                    stamp.innerHTML = "<span>灵天教育</span><span>登记专用章</span>";
                    inner.appendChild(stamp);

                    page.appendChild(inner);
                    scanBody.appendChild(page);
                }
            }

            function success() {
                gate.style.display = "none";
                scanView.classList.add("is-open");
                renderScan("LT-" + Date.now());
                window.scrollTo(0, 0);
            }

            function fail() {
                msg.classList.add("is-error");
                msg.textContent = "密码错误";
            }

            function resetMsg() {
                msg.classList.remove("is-error");
                msg.textContent = "";
            }

            pwd.addEventListener("input", resetMsg);
            pwd.addEventListener("keydown", function (e) {
                if (e.key !== "Enter") return;
                e.preventDefault();
                resetMsg();
                var v = (pwd.value || "").trim();
                if (!v) return fail();
                var low = v.toLowerCase();
                for (var i = 0; i < PASSWORDS.length; i++) {
                    if (low === String(PASSWORDS[i]).toLowerCase()) return success();
                }
                return fail();
            });

            scanBack.addEventListener("click", function () {
                scanView.classList.remove("is-open");
                gate.style.display = "";
                pwd.value = "";
                resetMsg();
                pwd.focus();
                window.scrollTo(0, 0);
            });

            setTimeout(function () {
                pwd.focus();
            }, 120);
        })();
    </script>
</body>
</html>
