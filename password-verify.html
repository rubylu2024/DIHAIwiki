<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>密码验证页</title>
    <style type="text/css">
        :root {
            --accent: #e4553b;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #000000;
            color: #f2f2f2;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .wrap {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 18px;
        }

        .gate {
            width: 720px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .art {
            width: 320px;
            max-width: 78vw;
            height: auto;
            filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.65));
        }

        .hint {
            margin-top: 18px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
        }

        .input-shell {
            margin-top: 14px;
            width: 520px;
            max-width: 92vw;
            height: 78px;
            background-image: url("image/密码页输入框.png");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            filter: drop-shadow(0 6px 18px rgba(228, 85, 59, 0.14));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 26px;
        }

        .pwd {
            width: 100%;
            height: 44px;
            border: 0;
            outline: none;
            background: transparent;
            font-size: 22px;
            letter-spacing: 2px;
            color: rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .pwd::placeholder {
            color: rgba(0, 0, 0, 0.28);
            letter-spacing: 1px;
        }

        .msg {
            margin-top: 0;
            height: 0;
            overflow: hidden;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.65);
        }

        .msg.is-error {
            color: rgba(228, 85, 59, 0.95);
            height: auto;
            margin-top: 10px;
        }

        .nav {
            position: fixed;
            left: 16px;
            top: 14px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .nav a:hover {
            color: rgba(255, 255, 255, 0.88);
            text-decoration: underline;
        }

        .list {
            width: 980px;
            max-width: 96vw;
            display: none;
        }

        .list.is-show {
            display: block;
        }

        .list img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="gate" id="gate">
            <img class="art" src="image/密码页图.png" alt="">
            <div class="hint">输入密码</div>
            <div class="input-shell">
                <input class="pwd" id="pwd" type="text" placeholder="" autocomplete="off" inputmode="text" autocapitalize="characters" spellcheck="false">
            </div>
            <div class="msg" id="msg"></div>
        </div>

        <div class="list" id="listView">
            <img src="image/list.png" alt="名单">
        </div>

        <div class="nav"><a href="index.html">返回首页</a></div>
    </div>

    <script>
        (function () {
            var PASSWORDS = ["ZIHUAMAJIANG"];
            var pwd = document.getElementById("pwd");
            var msg = document.getElementById("msg");
            var gate = document.getElementById("gate");
            var listView = document.getElementById("listView");

            if (!pwd || !msg || !gate || !listView) return;

            function success() {
                gate.style.display = "none";
                listView.classList.add("is-show");
            }

            function fail() {
                msg.classList.add("is-error");
                msg.textContent = "密码错误";
            }

            function resetMsg() {
                msg.classList.remove("is-error");
                msg.textContent = "";
            }

            function normalizeInput() {
                var v = String(pwd.value || "");
                var onlyLetters = v.replace(/[^a-zA-Z]/g, "");
                var up = onlyLetters.toUpperCase();
                if (pwd.value !== up) {
                    pwd.value = up;
                }
            }

            pwd.addEventListener("input", function () {
                normalizeInput();
                resetMsg();
            });
            pwd.addEventListener("keydown", function (e) {
                if (e.key !== "Enter") return;
                e.preventDefault();
                resetMsg();
                normalizeInput();
                var v = (pwd.value || "").trim().toUpperCase();
                if (!v) return fail();
                for (var i = 0; i < PASSWORDS.length; i++) {
                    if (v === String(PASSWORDS[i]).toUpperCase()) return success();
                }
                return fail();
            });

            setTimeout(function () {
                pwd.focus();
            }, 120);
        })();
    </script>
</body>
</html>
